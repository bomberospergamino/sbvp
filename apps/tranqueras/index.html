<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#073a59">
  <title>Tranqueras rurales · SBVP</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../" aria-label="Volver al inicio">‹</a>
    <a class="brand" href="../../" aria-label="Ir al inicio"><img src="../../logo-sbvp.png" alt="Escudo SBVP"></a>
    <div class="heading"><span>SBVP · RECURSOS OPERATIVOS</span><h1>Tranqueras rurales</h1></div>
    <button id="fitBtn" class="header-button" type="button">Ver todas</button>
  </header>

  <main>
    <section class="map-panel" aria-label="Mapa de tranqueras rurales">
      <div id="map"></div>
      <button id="locateBtn" class="locate" type="button" title="Mostrar mi ubicación" aria-label="Mostrar mi ubicación">⌖</button>
    </section>

    <aside class="sidebar">
      <div class="sidebar-head">
        <div><p class="eyebrow">Referencias rurales</p><h2>Tranqueras <span id="count">0</span></h2></div>
        <button id="refreshBtn" class="refresh" type="button" aria-label="Actualizar información">↻</button>
      </div>
      <label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Buscar por código o titular" autocomplete="off"></label>
      <p id="status" class="status" role="status">Cargando ubicaciones…</p>
      <div id="gateList" class="gate-list" aria-live="polite"></div>
    </aside>
  </main>

  <dialog id="detailsDialog"><div id="detailsContent"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
